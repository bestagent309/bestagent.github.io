# Site identity
title: "Sourcing & Shipping Notes"
SEOTitle: "Taobao Agent & China Shipping Guides | Sourcing & Shipping Notes"
author: "Sourcing & Shipping Notes"
header-img: img/post-bg-desk.jpg
email: false
description: "Compare Taobao agents and China shipping options by total cost, warehouse QC, consolidation, return terms, and destination-specific quotes."
keyword: "best taobao agent, cheapest china shipping agent, Taobao agent comparison, China shipping costs, shopping agent fees, parcel consolidation, warehouse QC, 1688 agent, Weidian agent"
url: "https://bestagent309.github.io"
baseurl: "/bestagent.github.io"
github_repo: "https://github.com/bestagent309/bestagent.github.io.git"

# Editorial profile: no unverified personal credentials or affiliations.
sidebar: true
sidebar-about-description: "Practical notes for choosing a Taobao agent and comparing China shipping costs. Start with your destination, inspection needs, and full delivered cost."
sidebar-avatar: false

# Social links
RSS: true
github_username: bestagent309

# Build settings
permalink: pretty
paginate: 10
exclude: ["less", "node_modules", "Gruntfile.js", "package.json", "README.md", "offline.html", "sw.js", "pwa", "codecov.yml"]
anchorjs: true
plugins: [jekyll-paginate, jekyll-sitemap]
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# Comments remain disabled until this site's own integration is configured.
gitalk:
  enable: false

# Configure site-owned analytics only when available.
ba_track_id: false
ga_track_id: false
ga_domain: auto

featured-tags: true
featured-condition-size: 0
chrome-tab-theme-color: "#243746"
service-worker: false
friends: false

lang: en
timezone: Asia/Shanghai
future: false
# Template posts are drafts; new editorial posts explicitly opt in.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      published: false
      author: "Sourcing & Shipping Notes"
# Site-wide topic paths used by navigation and editorial links.
agent_guide_path: /taobao-agents/
shipping_guide_path: /china-shipping/
